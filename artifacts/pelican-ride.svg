<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">鹈鹕的海边骑行</title>
  <desc id="description">一只戴着珊瑚红骑行头盔的白鹈鹕，笑眯眯地踩着脚踏，骑着橘红自行车沿海滨公路向前。车轮旋转，路面和路旁的草往后掠过。</desc>
  <style>
    .ink { stroke: #223b45; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .round { stroke-linecap: round; stroke-linejoin: round; }
    .spokes, .pedal-orbit, .pedal-level { transform-origin: 0 0; }
    .spokes { animation: turn 1.28s linear infinite; }
    .road-scroll { animation: road-roll 1.28s linear infinite; }
    .verge-scroll { animation: verge-roll 6.4s linear infinite; }
    .pedal-orbit { animation: turn 1.6s linear infinite; }
    .pedal-level { animation: level 1.6s linear infinite; }
    .leg { animation: pedal-leg 1.6s linear infinite; }
    .far-orbit { transform: rotate(180deg); }
    .far-level { transform: rotate(-180deg); }
    .far-orbit, .far-level, .far-leg { animation-delay: -.8s; }
    .rider-sway { transform-origin: 438px 333px; animation: sway 3.2s ease-in-out infinite; }
    .blink { transform-origin: 553px 165px; animation: blink 6.4s linear infinite; }
    .cloud-drift { animation: drift 6.4s ease-in-out infinite; }
    .cloud-drift-late { animation-delay: -3.2s; }
    .breeze { animation: breeze 3.2s ease-in-out infinite; }

    @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes level { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes road-roll { to { transform: translateX(-540px); } }
    @keyframes verge-roll { to { transform: translateX(-480px); } }
    @keyframes sway { 50% { transform: translateY(1.4px) rotate(.95deg); } }
    @keyframes blink { 0%, 55%, 59%, 100% { transform: scaleY(1); } 57% { transform: scaleY(.11); } }
    @keyframes drift { 50% { transform: translateX(19px); } }
    @keyframes breeze { 0%, 100% { opacity: .36; } 50% { opacity: .77; transform: translateX(-16px); } }
    @keyframes pedal-leg {
      0%, 100% { d: path('M438 333 Q491 365 498 379 Q502 391 486 450'); }
      12.5% { d: path('M438 333 Q473 382 480 396 Q484 408 478 468'); }
      25% { d: path('M438 333 Q458 390 465 404 Q469 416 460 476'); }
      37.5% { d: path('M438 333 Q463 388 470 402 Q474 414 442 468'); }
      50% { d: path('M438 333 Q474 382 481 396 Q485 408 434 450'); }
      62.5% { d: path('M438 333 Q488 369 495 383 Q499 395 442 432'); }
      75% { d: path('M438 333 Q498 354 505 368 Q509 380 460 424'); }
      87.5% { d: path('M438 333 Q500 351 507 365 Q511 377 478 432'); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spokes, .road-scroll, .verge-scroll, .pedal-orbit, .pedal-level,
      .leg, .rider-sway, .blink, .cloud-drift, .breeze { animation: none; }
    }
  </style>

